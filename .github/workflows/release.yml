name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Run tests
      run: |
        cd app
        go test ./... -v

    - name: Build binaries
      run: |
        cd app
        GOOS=linux GOARCH=amd64 go build -o go-websocket-chat-linux-amd64
        GOOS=darwin GOARCH=amd64 go build -o go-websocket-chat-darwin-amd64
        GOOS=windows GOARCH=amd64 go build -o go-websocket-chat-windows-amd64.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/go-websocket-chat-linux-amd64
          app/go-websocket-chat-darwin-amd64
          app/go-websocket-chat-windows-amd64.exe
        generate_release_notes: true
