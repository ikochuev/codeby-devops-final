<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  ssl_verify false
  logstash_format true
  logstash_prefix docker
  logstash_dateformat %Y.%m.%d
  include_timestamp true
  time_key @timestamp
  flush_interval 2s
  <buffer>
    @type memory
    flush_interval 2s
    flush_thread_count 2
    retry_forever true
  </buffer>
</match>
